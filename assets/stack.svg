<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">My stack</title>
  <desc id="d">CMS: WordPress, WooCommerce, Shopify, Wix, Webflow, Squarespace, HubSpot. Backend: PHP, Laravel, MySQL, Python. Frontend: HTML5, CSS3, JavaScript, jQuery, Bootstrap. Ops: VPS, cPanel, Git.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
    .lane{opacity:0;animation:in .7s ease-out forwards}
    .l1{animation-delay:.1s}.l2{animation-delay:.3s}.l3{animation-delay:.5s}.l4{animation-delay:.7s}
    @keyframes in{from{opacity:0}to{opacity:1}}
    .chip rect{fill:#ffffff;fill-opacity:.05;stroke:#ffffff;stroke-opacity:.12}
    .chip text{font-size:15px;fill:#eef1fa}
    @media (prefers-reduced-motion:reduce){.lane{animation:none;opacity:1}}
  </style>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="40" y="58" class="mono" font-size="13" fill="#3ee08f">// 03 · STACK</text>
  <text x="40" y="92" class="sans" font-size="26" font-weight="700" fill="#eef1fa">Tools I reach for</text>

  <g class="sans">
    <!-- CMS -->
    <g class="lane l1" transform="translate(40 120)">
      <text y="26" class="mono" font-size="13" fill="#8b95b5">CMS</text>
      <g class="chip" transform="translate(130 0)"><rect width="118" height="38" rx="19"/><text x="18" y="25">WordPress</text></g>
      <g class="chip" transform="translate(258 0)"><rect width="136" height="38" rx="19"/><text x="18" y="25">WooCommerce</text></g>
      <g class="chip" transform="translate(404 0)"><rect width="96" height="38" rx="19"/><text x="18" y="25">Shopify</text></g>
      <g class="chip" transform="translate(510 0)"><rect width="66" height="38" rx="19"/><text x="18" y="25">Wix</text></g>
      <g class="chip" transform="translate(586 0)"><rect width="100" height="38" rx="19"/><text x="18" y="25">Webflow</text></g>
      <g class="chip" transform="translate(696 0)"><rect width="128" height="38" rx="19"/><text x="18" y="25">Squarespace</text></g>
      <g class="chip" transform="translate(834 0)"><rect width="100" height="38" rx="19"/><text x="18" y="25">HubSpot</text></g>
    </g>
    <!-- Backend -->
    <g class="lane l2" transform="translate(40 170)">
      <text y="26" class="mono" font-size="13" fill="#8b95b5">BACKEND</text>
      <g class="chip" transform="translate(130 0)"><rect width="66" height="38" rx="19"/><text x="18" y="25">PHP</text></g>
      <g class="chip" transform="translate(206 0)"><rect width="94" height="38" rx="19"/><text x="18" y="25">Laravel</text></g>
      <g class="chip" transform="translate(310 0)"><rect width="88" height="38" rx="19"/><text x="18" y="25">MySQL</text></g>
      <g class="chip" transform="translate(408 0)"><rect width="92" height="38" rx="19"/><text x="18" y="25">Python</text></g>
      <g class="chip" transform="translate(510 0)"><rect width="100" height="38" rx="19"/><text x="18" y="25">REST APIs</text></g>
      <g class="chip" transform="translate(620 0)"><rect width="80" height="38" rx="19"/><text x="18" y="25">AJAX</text></g>
    </g>
    <!-- Frontend -->
    <g class="lane l3" transform="translate(40 220)">
      <text y="26" class="mono" font-size="13" fill="#8b95b5">FRONTEND</text>
      <g class="chip" transform="translate(130 0)"><rect width="88" height="38" rx="19"/><text x="18" y="25">HTML5</text></g>
      <g class="chip" transform="translate(228 0)"><rect width="76" height="38" rx="19"/><text x="18" y="25">CSS3</text></g>
      <g class="chip" transform="translate(314 0)"><rect width="114" height="38" rx="19"/><text x="18" y="25">JavaScript</text></g>
      <g class="chip" transform="translate(438 0)"><rect width="88" height="38" rx="19"/><text x="18" y="25">jQuery</text></g>
      <g class="chip" transform="translate(536 0)"><rect width="110" height="38" rx="19"/><text x="18" y="25">Bootstrap</text></g>
      <g class="chip" transform="translate(656 0)"><rect width="88" height="38" rx="19"/><text x="18" y="25">Figma</text></g>
    </g>
    <!-- Ops -->
    <g class="lane l4" transform="translate(40 270)">
      <text y="26" class="mono" font-size="13" fill="#8b95b5">OPS &amp; TOOLS</text>
      <g class="chip" transform="translate(130 0)"><rect width="68" height="38" rx="19"/><text x="18" y="25">VPS</text></g>
      <g class="chip" transform="translate(208 0)"><rect width="140" height="38" rx="19"/><text x="18" y="25">cPanel / WHM</text></g>
      <g class="chip" transform="translate(358 0)"><rect width="128" height="38" rx="19"/><text x="18" y="25">DigitalOcean</text></g>
      <g class="chip" transform="translate(496 0)"><rect width="126" height="38" rx="19"/><text x="18" y="25">Git / GitHub</text></g>
      <g class="chip" transform="translate(632 0)"><rect width="108" height="38" rx="19"/><text x="18" y="25">Cursor AI</text></g>
    </g>
  </g>
</svg>
